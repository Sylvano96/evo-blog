spring.application.name=EvoBlog

# Secrets are NEVER written in this file. Provide them as environment variables
# or in a local, git-ignored file: SpringBoot/.env (see .env.example).
spring.config.import=optional:file:.env[.properties]

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evoblog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Mail ----------
# When MAIL_ENABLED=false (default) activation codes are written to the log
# instead of being emailed - convenient for local development.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# ---------- Security ----------
# At least 32 characters. If empty, a random key is generated at startup
# (all users are logged out on every restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
# Optional: creates an admin account at startup if it does not exist yet.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Trust X-Forwarded-For only from private-network proxies (the Angular server in Docker),
# so rate limiting sees the real client IP.
server.forward-headers-strategy=native

# ---------- Uploads ----------
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Errors & logs ----------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.file.name=${LOG_FILE:logs/evoblog.log}
